# Agent Trace draft-revision drift — compare the pinned Agent Trace RFC revision
# against the committed upstream snapshot and open an issue when they diverge
# (M30 PRV-2, PRD 53 §PRV-2). The check never edits anything; a human reviews and
# re-pins (docs/design/code-provenance.md).
name: Agent Trace draft drift

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (make setup)
        run: make setup
      - name: Check Agent Trace drift
        id: drift
        continue-on-error: true
        run: python scripts/agent_trace_drift_check.py schema/agent-trace/upstream-revision.json
      - name: Open an issue on drift
        if: steps.drift.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Agent Trace draft revision drift detected" \
            --body "The Agent Trace drift check found that the pinned revision and the committed upstream snapshot diverge. Review \`schema/agent-trace/upstream-revision.json\` and \`AGENT_TRACE_SPEC_REVISION\` in \`packages/python-sdk/src/agentwatch/agent_trace.py\`, update the mapping if the draft changed, and re-pin following \`docs/design/code-provenance.md\`." \
            --label "0.2.0,enhancement"
