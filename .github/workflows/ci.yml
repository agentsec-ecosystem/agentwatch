# agentwatch CI — lint, strict types, and tests with the coverage gate.
#
# Runs the same Makefile targets a developer runs locally (see docs/development.md):
#   make lint       ruff, zero violations
#   make typecheck  mypy --strict
#   make test       pytest with coverage >= 95% + the repo guard
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: quality (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (make setup)
        run: make setup
      - name: Lint (ruff)
        run: make lint
      - name: Type-check (mypy --strict)
        run: make typecheck
      - name: Test (pytest, coverage >= 95%)
        run: make test
