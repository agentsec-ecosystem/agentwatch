# E2E — Playwright against the full compose stack (M14 Q5, #222). Boots Postgres +
# API + analytics + web, seeds the read model, and drives the browser suite. The
# no-network claim test lives in offline-e2e.yml.
name: E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install Python (make setup)
        run: make setup
      - name: Install web deps
        working-directory: apps/web
        run: npm ci
      - name: Install Playwright browsers
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Run Playwright E2E
        run: bash scripts/run-e2e.sh
      - name: Compose logs (failure)
        if: failure()
        run: docker compose logs --no-color || true
      - name: Upload Playwright report (failure)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: apps/web/test-results
          if-no-files-found: ignore
