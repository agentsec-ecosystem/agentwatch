# Nightly parser fuzzing — hook JSON, socket frames, store lines, transcripts,
# NDJSON/OTel ingest, and MCP JSON-RPC (PRD 38 §Q3, issue #220). Bounded wall time;
# a crash found becomes a committed regression `@example`.
name: Fuzz

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (make setup)
        run: make setup
      - name: Fuzz the parsers (1000 examples/harness)
        env:
          FUZZ_PROFILE: fuzz
        run: python -m pytest packages/python-sdk/tests/test_fuzz_parsers.py -q
