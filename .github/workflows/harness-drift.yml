# Harness version drift — fingerprint conformance fixtures and open an issue when
# a harness's native event shape changes (M10 N4 #215). The check never edits
# anything; a human reviews compatible-vs-breaking.
name: Harness drift

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (make setup)
        run: make setup
      - name: Check harness drift
        id: drift
        continue-on-error: true
        run: python scripts/check_harness_drift.py
      - name: Open an issue on drift
        if: steps.drift.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Harness version drift detected" \
            --body "The nightly harness-drift check found a fixture shape change. See the \`Harness drift\` workflow run and regenerate the baseline only after reviewing whether the change is compatible. Run \`python scripts/generate_compatibility.py\` to refresh." \
            --label "0.1.0,enhancement"
