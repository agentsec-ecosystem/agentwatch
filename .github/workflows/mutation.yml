# Mutation gate — the trust path (chain/store, redaction, validation) must fail
# the focused tests when mutated (PRD 38 §Q2, issue #219). Nightly so the ratchet
# is defended without slowing every PR; the curated set runs in seconds.
name: Mutation gate

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "packages/python-sdk/src/agentwatch/store.py"
      - "packages/python-sdk/src/agentwatch/redact.py"
      - "packages/python-sdk/src/agentwatch/secrets.py"
      - "packages/python-sdk/src/agentwatch/records.py"
      - "scripts/mutation_gate.py"
      - ".github/workflows/mutation.yml"

permissions:
  contents: read

jobs:
  mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (make setup)
        run: make setup
      - name: Prove the gate fails on a survivor
        run: python scripts/mutation_gate.py --self-test
      - name: Mutation gate (budget 0)
        run: python scripts/mutation_gate.py --budget 0
