# Nightly soak — bounded memory, verify time, and store size under sustained
# load (M12 K4, NFR-7). Results feed docs/reference/resource-cost.md.
name: Soak

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  soak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (make setup)
        run: make setup
      - name: Soak (20k records)
        run: python scripts/soak.py
