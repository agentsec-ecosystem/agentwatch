# Windows CI leg (M27 WIN-1, #350). Runs the platform-independent SDK subset on
# windows-latest: the service-unit generation (launchd/systemd/Task Scheduler),
# packaging metadata, and a clean import smoke test.
name: Windows

on:
  pull_request:
    paths:
      - "packages/python-sdk/src/agentwatch/service.py"
      - "packages/python-sdk/tests/test_windows.py"
      - "packages/python-sdk/tests/test_service.py"
      - ".github/workflows/windows.yml"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-sdk:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install the SDK
        working-directory: packages/python-sdk
        run: python -m pip install -e ".[dev]"
      - name: Import smoke test
        working-directory: packages/python-sdk
        run: python -c "import agentwatch, agentwatch.service, agentwatch.daemon; print('import ok')"
      - name: Platform-independent SDK subset
        working-directory: packages/python-sdk
        run: python -m pytest tests/test_service.py tests/test_windows.py tests/test_packaging_metadata.py -q
