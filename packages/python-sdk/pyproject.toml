[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentsec-agentwatch"
version = "0.2.1"
description = "Execution traces for agent behavior - OpenTelemetry-style observability for AI agent workflows"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Debashish Ghosal", email = "deghosal@gmail.com" }]
keywords = ["ai-agents", "observability", "opentelemetry", "agent-security", "llm", "tracing", "monitoring"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
dependencies = [
    "opentelemetry-api>=1.24",
    "opentelemetry-sdk>=1.24",
    "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
langgraph = [
    "langgraph>=1.0",
]
codex = [
    # Codex rollout logs may be ``.jsonl.zst``. Python 3.14+ has ``compression.zstd``
    # in the stdlib; older interpreters need this extra (M27 COD-1).
    "zstandard>=0.22; python_version < '3.14'",
]
signing = [
    "cryptography>=41",
]
otlp = [
    "opentelemetry-exporter-otlp-proto-grpc>=1.24",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.9",
    "mypy>=1.13",
    "build>=1.2",
    "jsonschema>=4.20",
    "tomli>=2",
    "opentelemetry-exporter-otlp-proto-grpc>=1.24",
    "hypothesis>=6.100",
    "zstandard>=0.22",
]

# Optional: deep, tool-driven mutation runs (PRD 38 Q2). Not installed by
# `make setup`; the enforced CI gate is scripts/mutation_gate.py.
mutation = [
    "cosmic-ray>=8.7",
]

[project.scripts]
agentwatch = "agentwatch.cli:main"
agentwatch-hook = "agentwatch.hook:main"
agentwatch-daemon = "agentwatch.daemon:main"
agentwatch-mcp-proxy = "agentwatch.mcp_proxy:main"
agentwatch-a2a-proxy = "agentwatch.a2a_proxy:main"

[project.urls]
Homepage = "https://github.com/agentsec-ecosystem/agentwatch"
Repository = "https://github.com/agentsec-ecosystem/agentwatch"
Issues = "https://github.com/agentsec-ecosystem/agentwatch/issues"
Documentation = "https://github.com/agentsec-ecosystem/agentwatch/blob/main/docs/README.md"
Changelog = "https://github.com/agentsec-ecosystem/agentwatch/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.ruff.lint.isort]
known-first-party = ["agentwatch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]

[tool.mypy]
strict = true
python_version = "3.10"
mypy_path = "src"